<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This Page About HTML Images">
    <meta name="keywords" content="HTML">
    <meta name="author" content="Nitin Bhardwaj">
    <meta name="robots" content="index, follow">
    <title>HTML Images</title>
    <link rel="shortcut icon" href="/Assets/favicon.ico" type="image/x-icon">
</head>
<body>
    <h1>HTML Images</h1>
    <h2>Relative URL Image</h2>
    <img src="/Assets/logo.webp" alt="nbcodeblog Logo" width="300" height="275">

    <h2>Absolute URL Image</h2>
    <img src="https://images.unsplash.com/photo-1775618189760-792fba0eb0f3?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDU3fDZzTVZqVExTa2VRfHxlbnwwfHx8fHw%3D" alt="Nature Image" width="350" height="250">

    <h2>Image as a Link</h2>
    <a href="https://nbcodeblog.github.io" target="_blank"><img src="https://images.unsplash.com/photo-1770027218173-45e512200cd0?q=80&w=869&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Nature Image" width="350" height="250"></a>

    <h2>Image Map</h2>
    <img src="/Assets/workplace_image.webp" alt="Workplace Image" usemap="#image1">
    <map name="image1">
        <area shape="rect" coords="34,44,270,350" href="https://nbcodeblog.github.io" alt="Computer Image">
        <area shape="rect" coords="290,172,333,250" href="https://nbcodeblog.github.io" alt="Mobile Image">
        <area shape="circle" coords="337,300,44" href="https://nbcodeblog.github.io" alt="Coffe Cup Image">
    </map>
    <br><br>

    <img src="/Assets/frenchfood_image.webp" alt="Croissant Image" usemap="#image2">
    <map name="image2">
        <area shape="poly" coords="140,121,181,116,204,160,204,222,191,270,140,329,85,355,58,352,37,322,40,259,103,161,128,147" href="https://nbcodeblog.github.io" alt="Croissant Image">
    </map>

    <h2>Picture Element</h2>
    <picture>
        <source media="(min-width: 650px)" srcset="https://images.unsplash.com/photo-1775618189760-792fba0eb0f3?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDU3fDZzTVZqVExTa2VRfHxlbnwwfHx8fHw%3D">
        <source media="(min-width: 465px)" srcset="https://images.unsplash.com/photo-1770027218173-45e512200cd0?q=80&w=869&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
        <img src="/Assets/logo.webp" alt="nbcodeblog Image" width="300" height="275">
    </picture>
</body>
</html>
